<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rana & Mazen — Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#faf7f8;
color:#4b3833;
}

.container{
width:min(850px,92%);
margin:35px auto;
}

.card{
background:white;
padding:25px;
border-radius:22px;
box-shadow:0 8px 30px #0001;
margin-bottom:20px;
}

h1,h2{
font-family:Georgia,serif;
text-align:center;
}

label{
display:block;
font-weight:bold;
margin:16px 0 7px;
}

input,textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
font-size:16px;
font-family:inherit;
}

textarea{
min-height:120px;
resize:vertical;
}

button{
border:0;
border-radius:12px;
padding:12px 20px;
font-size:15px;
cursor:pointer;
margin-top:10px;
}

.primary{
background:#624740;
color:white;
width:100%;
}

.secondary{
background:#eee;
color:#333;
}

.danger{
background:#f3d5d5;
color:#7a3333;
}

.item{
border:1px solid #eee;
padding:15px;
border-radius:14px;
margin:12px 0;
}

.hidden{
display:none!important;
}

#loginMessage,
#message{
text-align:center;
margin-top:15px;
font-weight:bold;
}

.logout{
float:left;
background:#eee;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h1>Rana & Mazen ♡</h1>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Email"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
>

<button
class="primary"
onclick="login()">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel" class="hidden">

<button
class="logout"
onclick="logout()">
Logout
</button>

<div style="clear:both"></div>

<div class="card">

<h1>Rana & Mazen ♡</h1>


<label>Names</label>

<input id="name">


<label>Date</label>

<input id="eventDate">


<label>Story</label>

<textarea id="story"></textarea>


<label>Song URL</label>

<input
id="music"
placeholder="Paste song URL"
>


<h2>Photos ♡</h2>

<label>
Photo URLs — one per line
</label>

<textarea
id="photos"
placeholder="Paste photo URLs here..."
></textarea>


<h2>Videos 🔐</h2>

<div id="videos"></div>

<button
class="secondary"
onclick="addVideo()">
+ Add video
</button>


<h2>Memories ♡</h2>

<div id="memories"></div>

<button
class="secondary"
onclick="addMemory()">
+ Add memory
</button>


<button
class="primary"
onclick="saveData()">
Save Changes ♡
</button>

<div id="message"></div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */

const SUPABASE_URL =
"https://jqpceabdshvboderrbiz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";


/*
Public connection:
used for reading the data,
because the public website already
has permission to read it.
*/

const publicDb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/*
Authenticated connection:
used for login and saving changes.
*/

const authDb =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let rowId=null;


/* LOGIN */

async function login(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const msg =
document.getElementById("loginMessage");

if(!email || !password){

msg.textContent =
"اكتبي الإيميل والباسورد";

return;

}

msg.textContent =
"Logging in...";


const {data,error} =
await authDb.auth.signInWithPassword({

email:email,

password:password

});


if(error){

msg.textContent =
error.message;

return;

}


if(data.session){

document
.getElementById("loginCard")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

await loadData();

}

}


/* LOGOUT */

async function logout(){

await authDb.auth.signOut();

document
.getElementById("adminPanel")
.classList.add("hidden");

document
.getElementById("loginCard")
.classList.remove("hidden");

}


/* LOAD */

async function loadData(){

const msg =
document.getElementById("message");


msg.textContent =
"Loading...";


const {data,error} =
await publicDb
.from("rana_mazen")
.select("*")
.limit(1);


if(error){

msg.textContent =
"Error: "+error.message;

return;

}


if(!data || !data.length){

msg.textContent =
"No data found";

return;

}


const row =
data[0];


rowId =
row.Id;


/* BASIC */

document
.getElementById("name")
.value =
row.Name || "";


document
.getElementById("eventDate")
.value =
row.Event_date || "";


document
.getElementById("story")
.value =
row.Story || "";


document
.getElementById("music")
.value =
row.Music || "";


/* PHOTOS */

let photos =
row.Photos || [];


if(typeof photos==="string"){

try{

photos =
JSON.parse(photos);

}catch(e){

photos=[];

}

}


if(!Array.isArray(photos))
photos=[];


document
.getElementById("photos")
.value =
photos.join("\n");


/* MEMORIES */

let memories =
row.Memories || [];


if(typeof memories==="string"){

try{

memories =
JSON.parse(memories);

}catch(e){

memories=[];

}

}


if(!Array.isArray(memories))
memories=[];


const memoriesBox =
document.getElementById("memories");

memoriesBox.innerHTML="";


memories.forEach(memory=>{

addMemory(memory);

});


/* VIDEOS */

let videos =
row.Videos || [];


if(typeof videos==="string"){

try{

videos =
JSON.parse(videos);

}catch(e){

videos=[];

}

}


if(!Array.isArray(videos))
videos=[];


const videosBox =
document.getElementById("videos");

videosBox.innerHTML="";


videos.forEach(video=>{

addVideo(video);

});


msg.textContent="";

}


/* ADD MEMORY */

function addMemory(memory=""){

const box =
document.getElementById("memories");

const item =
document.createElement("div");

item.className="item";


let value="";


if(typeof memory==="string"){

value=memory;

}else if(memory){

value =
memory.text ||
"";

}


item.innerHTML=`

<textarea
class="memoryText"
placeholder="اكتبي الذكرى هنا..."
></textarea>

<button
class="danger"
onclick="this.parentElement.remove()">
Remove
</button>

`;


box.appendChild(item);


item
.querySelector(".memoryText")
.value=value;

}


/* ADD VIDEO */

function addVideo(video=""){

const box =
document.getElementById("videos");

const item =
document.createElement("div");

item.className="item";


item.innerHTML=`

<label>Video URL</label>

<input
class="videoUrl"
type="url"
placeholder="Paste video URL here..."
>

<button
class="danger"
onclick="this.parentElement.remove()">
Remove
</button>

`;


box.appendChild(item);


item
.querySelector(".videoUrl")
.value =
video || "";

}


/* SAVE */

async function saveData(){

const msg =
document.getElementById("message");


if(!rowId){

msg.textContent =
"No data row found";

return;

}


msg.textContent =
"Saving...";


/* PHOTOS */

const photos =
document
.getElementById("photos")
.value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);


/* MEMORIES */

const memories =
Array
.from(
document.querySelectorAll(".memoryText")
)
.map(x=>x.value.trim())
.filter(Boolean);


/* VIDEOS */

const videos =
Array
.from(
document.querySelectorAll(".videoUrl")
)
.map(x=>x.value.trim())
.filter(Boolean);


/* UPDATE */

const {error} =
await authDb
.from("rana_mazen")
.update({

Name:
document
.getElementById("name")
.value
.trim(),

Event_date:
document
.getElementById("eventDate")
.value
.trim(),

Story:
document
.getElementById("story")
.value,

Music:
document
.getElementById("music")
.value
.trim(),

Photos:
photos,

Memories:
memories,

Videos:
videos

})
.eq("Id",rowId);


if(error){

msg.textContent =
"Save failed: "+error.message;

return;

}


msg.textContent =
"Saved online successfully ♡";

}


/* CHECK SESSION */

async function checkSession(){

const {data} =
await authDb.auth.getSession();


if(data.session){

document
.getElementById("loginCard")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

await loadData();

}

}


checkSession();

</script>

</body>
</html>
