<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rana & Mazen — Admin</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#faf7f8;
color:#333;
}

.container{
width:min(900px,92%);
margin:40px auto;
}

.card{
background:#fff;
border-radius:20px;
padding:25px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{text-align:center}

label{
display:block;
margin:15px 0 7px;
font-weight:bold;
}

input,textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
font-family:inherit;
}

textarea{
min-height:110px;
resize:vertical;
}

button{
border:0;
border-radius:10px;
padding:12px 18px;
cursor:pointer;
font-size:15px;
margin-top:12px;
}

.primary{
background:#222;
color:white;
width:100%;
}

.secondary{background:#eee}
.danger{background:#f3d4d4}

.item{
border:1px solid #eee;
padding:15px;
border-radius:12px;
margin-top:12px;
}

.hidden{display:none}

#loginMessage,#message{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.logout{
float:right;
background:#eee;
}

.clear{clear:both}

h2{
margin-top:30px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginCard" class="card">

<h1>Rana & Mazen ♡</h1>

<label>Email</label>
<input id="email" type="email">

<label>Password</label>
<input id="password" type="password">

<button class="primary" onclick="login()">
Login
</button>

<div id="loginMessage"></div>

</div>


<!-- ADMIN -->

<div id="adminPanel" class="hidden">

<button class="logout" onclick="logout()">
Logout
</button>

<div class="clear"></div>

<div class="card">

<h1>Rana & Mazen ♡</h1>


<label>Names</label>
<input id="name">


<label>Date</label>
<input id="eventDate">


<label>Story</label>
<textarea id="story"></textarea>


<label>Song URL</label>
<input id="music">


<h2>Photos</h2>

<label>Photo URLs — one per line</label>
<textarea id="photos"></textarea>


<h2>Videos 🔐</h2>

<div id="videos"></div>

<button class="secondary" onclick="addVideo()">
+ Add video
</button>


<h2>Memories ♡</h2>

<div id="memories"></div>

<button class="secondary" onclick="addMemory()">
+ Add memory
</button>


<button class="primary" onclick="saveData()">
Save Changes ♡
</button>

<div id="message"></div>

</div>
</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jqpceabdshvboderrbiz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* LOGIN */

async function login(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const msg =
document.getElementById("loginMessage");

if(!email || !password){

msg.textContent =
"Enter your email and password.";

return;
}

msg.textContent="Logging in...";

const {data,error} =
await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){

msg.textContent =
error.message;

return;
}

if(data.session){

showAdmin();

await loadData();

}

}


/* LOGOUT */

async function logout(){

await db.auth.signOut();

document
.getElementById("adminPanel")
.classList.add("hidden");

document
.getElementById("loginCard")
.classList.remove("hidden");

document.getElementById("email").value="";
document.getElementById("password").value="";

}


/* SHOW ADMIN */

function showAdmin(){

document
.getElementById("loginCard")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

}


/* LOAD DATA */

async function loadData(){

const msg =
document.getElementById("message");

msg.textContent="Loading...";

const {data,error} =
await db
.from("rana_mazen")
.select("*")
.limit(1);

if(error){

msg.textContent =
"Error loading data: "+error.message;

return;
}

if(!data || !data.length){

msg.textContent="No data found.";

return;
}

const item=data[0];


/* BASIC DATA */

document.getElementById("name").value =
item.Name || "";

document.getElementById("eventDate").value =
item.Event_date || "";

document.getElementById("story").value =
item.Story || "";

document.getElementById("music").value =
item.Music || "";


/* PHOTOS */

let photos=item.Photos || [];

if(!Array.isArray(photos))
photos=[];

document.getElementById("photos").value =
photos.join("\n");


/* MEMORIES */

const memoriesBox =
document.getElementById("memories");

memoriesBox.innerHTML="";

let memories=item.Memories || [];

if(!Array.isArray(memories))
memories=[];

memories.forEach(memory=>{
addMemory(memory);
});


/* VIDEOS */

const videosBox =
document.getElementById("videos");

videosBox.innerHTML="";

let videos=item.Videos || [];

if(!Array.isArray(videos))
videos=[];

videos.forEach(video=>{
addVideo(video);
});


msg.textContent="";

}


/* ADD MEMORY */

function addMemory(memory=""){

const container =
document.getElementById("memories");

const div =
document.createElement("div");

div.className="item";

div.innerHTML=`

<textarea
class="memoryText"
placeholder="Write your memory here..."
></textarea>

<button
class="danger"
onclick="this.parentElement.remove()">
Remove
</button>

`;

container.appendChild(div);

if(typeof memory==="string"){

div.querySelector(".memoryText").value=
memory;

}else if(memory && memory.text){

div.querySelector(".memoryText").value=
memory.text;

}

}


/* ADD VIDEO */

function addVideo(video=""){

const container =
document.getElementById("videos");

const div =
document.createElement("div");

div.className="item";

div.innerHTML=`

<label>Video URL</label>

<input
class="videoUrl"
type="url"
placeholder="Paste video URL here..."
>

<button
class="danger"
onclick="this.parentElement.remove()">
Remove
</button>

`;

container.appendChild(div);

div.querySelector(".videoUrl").value=
video || "";

}


/* SAVE */

async function saveData(){

const msg =
document.getElementById("message");

msg.textContent="Saving...";


const name =
document.getElementById("name").value.trim();

const eventDate =
document.getElementById("eventDate").value.trim();

const story =
document.getElementById("story").value;

const music =
document.getElementById("music").value.trim();


/* PHOTOS */

const photos =
document
.getElementById("photos")
.value
.split("\n")
.map(x=>x.trim())
.filter(Boolean);


/* MEMORIES */

const memories =
Array.from(
document.querySelectorAll(".memoryText")
)
.map(x=>x.value.trim())
.filter(Boolean);


/* VIDEOS */

const videos =
Array.from(
document.querySelectorAll(".videoUrl")
)
.map(x=>x.value.trim())
.filter(Boolean);


/* FIND ROW */

const {data:existing,error:findError} =
await db
.from("rana_mazen")
.select("Id")
.limit(1);

if(findError){

msg.textContent=
"Could not find data: "+
findError.message;

return;
}

if(!existing || !existing.length){

msg.textContent=
"No existing row found.";

return;
}


const id=existing[0].Id;


/* UPDATE */

const {error:updateError} =
await db
.from("rana_mazen")
.update({

Name:name,
Event_date:eventDate,
Story:story,
Music:music,
Photos:photos,
Memories:memories,
Videos:videos

})
.eq("Id",id);


if(updateError){

msg.textContent=
"Save failed: "+
updateError.message;

return;
}


msg.textContent=
"Saved online successfully ♡";

}


/* CHECK CURRENT SESSION */

async function checkSession(){

const {data} =
await db.auth.getSession();

if(data.session){

showAdmin();

await loadData();

}

}

checkSession();

</script>

</body>
</html>
