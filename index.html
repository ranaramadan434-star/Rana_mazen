<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rana & Mazen — Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7f8;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 12px;
    }

    .primary {
      background: #222;
      color: white;
      width: 100%;
    }

    .secondary {
      background: #eee;
    }

    .danger {
      background: #f3d4d4;
    }

    .memory {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    #message,
    #loginMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .logout {
      float: right;
      background: #eee;
    }

    .clear {
      clear: both;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">

    <h1>Rana & Mazen ♡</h1>

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">

    <button class="logout" onclick="logout()">
      Logout
    </button>

    <div class="clear"></div>

    <div class="card">

      <h1>Rana & Mazen ♡</h1>

      <label>Names</label>
      <input id="name">

      <label>Date</label>
      <input id="eventDate" type="text">

      <label>Story</label>
      <textarea id="story"></textarea>

      <label>Song URL</label>
      <input id="music" type="text">

      <label>Photo URLs</label>
      <textarea
        id="photos"
        placeholder="Put one photo URL per line"
      ></textarea>

      <h2 style="margin-top:25px;">
        Memories
      </h2>

      <div id="memories"></div>

      <button
        class="secondary"
        onclick="addMemory()">
        + Add memory
      </button>

      <button
        class="primary"
        onclick="saveData()">
        Save Changes ♡
      </button>

      <div id="message"></div>

    </div>

  </div>

</div>


<script>

  /* =====================================
     SUPABASE
     ===================================== */

  const SUPABASE_URL =
    "https://jqpceabdshvboderrbiz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =====================================
     LOGIN
     ===================================== */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    if (!email || !password) {
      message.textContent =
        "Please enter your email and password.";
      return;
    }

    message.textContent =
      "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.textContent =
        "Login failed: " + error.message;

      return;
    }

    message.textContent = "";

    showAdmin();

    await loadData();
  }


  /* =====================================
     LOGOUT
     ===================================== */

  async function logout() {

    await supabaseClient.auth.signOut();

    document
      .getElementById("adminPanel")
      .classList.add("hidden");

    document
      .getElementById("loginCard")
      .classList.remove("hidden");

    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  }


  /* =====================================
     SHOW ADMIN
     ===================================== */

  function showAdmin() {

    document
      .getElementById("loginCard")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");
  }


  /* =====================================
     LOAD DATA
     ===================================== */

  async function loadData() {

    const message =
      document.getElementById("message");

    message.textContent =
      "Loading...";

    const { data, error } =
      await supabaseClient
        .from("rana_mazen")
        .select("*")
        .limit(1);

    if (error) {

      message.textContent =
        "Error loading data: " + error.message;

      return;
    }

    if (!data || data.length === 0) {

      message.textContent =
        "No data found.";

      return;
    }

    const item = data[0];

    document.getElementById("name").value =
      item.Name || "";

    document.getElementById("eventDate").value =
      item.Event_date || "";

    document.getElementById("story").value =
      item.Story || "";

    document.getElementById("music").value =
      item.Music || "";


    /* PHOTOS */

    let photos = item.Photos || [];

    if (!Array.isArray(photos)) {
      photos = [];
    }

    document.getElementById("photos").value =
      photos.join("\n");


    /* MEMORIES */

    const memoriesContainer =
      document.getElementById("memories");

    memoriesContainer.innerHTML = "";

    let memories = item.Memories || [];

    if (!Array.isArray(memories)) {
      memories = [];
    }

    memories.forEach(function(memory) {

      addMemory(memory);

    });

    message.textContent = "";
  }


  /* =====================================
     ADD MEMORY
     ===================================== */

  function addMemory(memory = "") {

    const container =
      document.getElementById("memories");

    const div =
      document.createElement("div");

    div.className = "memory";

    div.innerHTML = `
      <textarea
        class="memoryText"
        placeholder="Write your memory here..."
      ></textarea>

      <button
        class="danger"
        onclick="this.parentElement.remove()">
        Remove
      </button>
    `;

    container.appendChild(div);

    const textarea =
      div.querySelector(".memoryText");

    if (typeof memory === "string") {
      textarea.value = memory;
    } else if (memory && memory.text) {
      textarea.value = memory.text;
    }
  }


  /* =====================================
     SAVE DATA
     ===================================== */

  async function saveData() {

    const message =
      document.getElementById("message");

    message.textContent =
      "Saving...";


    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const eventDate =
      document
        .getElementById("eventDate")
        .value
        .trim();

    const story =
      document
        .getElementById("story")
        .value;

    const music =
      document
        .getElementById("music")
        .value
        .trim();


    const photos =
      document
        .getElementById("photos")
        .value
        .split("\n")
        .map(function(x) {
          return x.trim();
        })
        .filter(Boolean);


    const memories =
      Array.from(
        document.querySelectorAll(".memoryText")
      )
      .map(function(x) {
        return x.value.trim();
      })
      .filter(Boolean);


    /* FIND EXISTING ROW */

    const {
      data: existing,
      error: findError
    } =
      await supabaseClient
        .from("rana_mazen")
        .select("Id")
        .limit(1);


    if (findError) {

      message.textContent =
        "Error: " + findError.message;

      return;
    }


    let result;


    /* UPDATE */

    if (existing && existing.length > 0) {

      result =
        await supabaseClient
          .from("rana_mazen")
          .update({
            Name: name,
            Event_date: eventDate,
            Story: story,
            Music: music,
            Photos: photos,
            Memories: memories
          })
          .eq("Id", existing[0].Id);

    }

    /* INSERT */

    else {

      result =
        await supabaseClient
          .from("rana_mazen")
          .insert({
            Name: name,
            Event_date: eventDate,
            Story: story,
            Music: music,
            Photos: photos,
            Memories: memories
          });

    }


    if (result.error) {

      message.textContent =
        "Save failed: " + result.error.message;

      return;
    }


    message.textContent =
      "Saved online successfully ♡";
  }


  /* =====================================
     CHECK EXISTING SESSION
     ===================================== */

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();

    if (data.session) {

      showAdmin();

      await loadData();

    }
  }


  /* =====================================
     START
     ===================================== */

  checkSession();

</script>

</body>
</html>
