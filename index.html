<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rana & Mazen — Admin</title>

<style>
body{
  margin:0;
  background:#f8f2ef;
  font-family:Arial,sans-serif;
  color:#332a29
}
.wrap{
  max-width:760px;
  margin:30px auto;
  padding:18px
}
.box{
  background:#fff;
  border-radius:22px;
  padding:28px;
  box-shadow:0 10px 40px #0001
}
h1{font-weight:400}
label{
  font-size:13px;
  color:#705d59
}
input,textarea{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin:5px 0 12px;
  font:15px Arial
}
button{
  padding:13px 20px;
  border:0;
  border-radius:10px;
  background:#4c3834;
  color:white;
  cursor:pointer
}
button.alt{
  background:#ddd;
  color:#332a29
}
.hidden{display:none}
.note{
  font-size:13px;
  line-height:1.6;
  color:#786966
}
.mem{
  border:1px solid #eadbd7;
  padding:15px;
  border-radius:14px;
  margin:10px 0
}
#status{
  margin-top:15px;
  font-size:14px
}
</style>
</head>

<body>

<div class="wrap">
<div class="box">

<h1>Rana & Mazen ♡</h1>

<div id="login">

<p class="note">
Admin area
</p>

<label>Username</label>
<input id="u">

<label>Password</label>
<input id="p" type="password">

<button onclick="login()">Enter</button>

<p id="e"></p>

</div>


<div id="panel" class="hidden">

<label>Names</label>
<input id="names" value="Rana & Mazen">

<label>Date</label>
<input id="date" value="03 / 11 / 2025">

<label>Story</label>
<textarea id="story" rows="7">Our story is just beginning… ♡</textarea>

<label>Song URL</label>
<input id="music" placeholder="Spotify / YouTube link">

<label>Photo URLs (one per line)</label>
<textarea id="photos" rows="5" placeholder="https://..."></textarea>

<h3>Memories</h3>

<div id="mems"></div>

<button class="alt" onclick="addMem()">+ Add memory</button>

<br><br>

<button onclick="saveData()">Save online ♡</button>

<p id="status"></p>

</div>
</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jqpceabdshvboderrbiz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentId = null;


/* LOGIN */

function login(){

  if(
    u.value.trim().toLowerCase()==="ranamazen" &&
    p.value==="10/10/2005"
  ){

    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");

    loadData();

  }else{

    e.textContent="Wrong username or password.";

  }
}


/* ADD MEMORY */

function addMem(data={}){

  let d=document.createElement("div");

  d.className="mem";

  d.innerHTML=`
    <input class="mt" placeholder="Memory title"
      value="${escapeHtml(data.title || "")}">

    <input class="md" placeholder="Date"
      value="${escapeHtml(data.date || "")}">

    <textarea class="mx" rows="3"
      placeholder="What happened?">${escapeHtml(data.text || "")}</textarea>
  `;

  document.getElementById("mems").appendChild(d);
}


/* ESCAPE TEXT */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* LOAD DATA */

async function loadData(){

  setStatus("Loading your data...");

  const {data,error} =
    await supabaseClient
      .from("rana_mazen")
      .select("*")
      .limit(1);

  if(error){

    console.error(error);

    setStatus(
      "Couldn't load the data. Check Supabase settings."
    );

    return;
  }


  if(data && data.length > 0){

    const row=data[0];

    currentId=row.id;

    document.getElementById("names").value =
      row.names || "Rana & Mazen";

    document.getElementById("date").value =
      row.event_date || "03 / 11 / 2025";

    document.getElementById("story").value =
      row.story || "";

    document.getElementById("music").value =
      row.music || "";

    document.getElementById("photos").value =
      Array.isArray(row.photos)
        ? row.photos.join("\n")
        : "";

    document.getElementById("mems").innerHTML="";

    if(Array.isArray(row.memories)){

      row.memories.forEach(memory=>{
        addMem(memory);
      });

    }

    setStatus("Data loaded ♡");

  }else{

    document.getElementById("mems").innerHTML="";

    setStatus("No saved data yet. Add your memories and press Save online ♡");

  }

}


/* SAVE DATA */

async function saveData(){

  setStatus("Saving...");

  const obj={

    names:document.getElementById("names").value,

    event_date:document.getElementById("date").value,

    story:document.getElementById("story").value,

    music:document.getElementById("music").value,

    photos:
      document.getElementById("photos").value
      .split("\n")
      .map(x=>x.trim())
      .filter(Boolean),

    memories:
      [...document.querySelectorAll(".mem")]
      .map(x=>({
        title:x.querySelector(".mt").value,
        date:x.querySelector(".md").value,
        text:x.querySelector(".mx").value
      }))

  };


  let result;


  if(currentId){

    result =
      await supabaseClient
        .from("rana_mazen")
        .update(obj)
        .eq("id",currentId);

  }else{

    result =
      await supabaseClient
        .from("rana_mazen")
        .insert(obj)
        .select()
        .single();

    if(result.data){

      currentId=result.data.id;

    }

  }


  if(result.error){

    console.error(result.error);

    setStatus(
      "Save failed. We need to adjust the Supabase permissions."
    );

    return;
  }


  setStatus("Saved online successfully ♡");

}


/* STATUS */

function setStatus(message){

  document.getElementById("status").textContent=message;

}

</script>

</body>
</html>
