<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rana & Mazen — Admin</title>
<style>
body{font-family:Arial;background:#faf7f8;color:#333;margin:0;padding:25px}
.box{max-width:700px;margin:auto;background:white;padding:25px;border-radius:20px;box-shadow:0 5px 25px #0001}
input,textarea{width:100%;padding:12px;margin:7px 0 15px;box-sizing:border-box;border:1px solid #ddd;border-radius:10px}
textarea{min-height:100px}
button{padding:12px 20px;border:0;border-radius:10px;margin:5px;cursor:pointer}
.primary{background:#5b4039;color:white;width:100%}
.danger{background:#f2d5d5}
.hidden{display:none}
.item{border:1px solid #eee;padding:15px;border-radius:12px;margin:10px 0}
</style>
</head>

<body>

<div class="box" id="login">

<h2>Rana & Mazen ♡</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button class="primary" onclick="login()">Login</button>

<p id="loginMsg"></p>

</div>


<div class="box hidden" id="admin">

<h2>Rana & Mazen ♡</h2>

<label>Names</label>
<input id="name">

<label>Date</label>
<input id="date">

<label>Story</label>
<textarea id="story"></textarea>

<label>Song URL</label>
<input id="music">

<h3>Photos</h3>
<textarea id="photos" placeholder="One URL per line"></textarea>

<h3>Videos 🔐</h3>
<div id="videos"></div>
<button onclick="addVideo()">+ Add video</button>

<h3>Memories ♡</h3>
<div id="memories"></div>
<button onclick="addMemory()">+ Add memory</button>

<br><br>

<button class="primary" onclick="save()">Save Changes ♡</button>

<p id="msg"></p>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db=supabase.createClient(
"https://jqpceabdshvboderrbiz.supabase.co",
"sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P"
);

let rowId=null;


async function login(){

const {data,error}=await db.auth.signInWithPassword({
email:document.getElementById("email").value,
password:document.getElementById("password").value
});

if(error){
document.getElementById("loginMsg").textContent=error.message;
return;
}

document.getElementById("login").classList.add("hidden");
document.getElementById("admin").classList.remove("hidden");

load();

}


async function load(){

const {data,error}=await db
.from("rana_mazen")
.select("*")
.limit(1);

if(error){
document.getElementById("msg").textContent=error.message;
return;
}

if(!data || !data.length){
document.getElementById("msg").textContent="No data found";
return;
}

const r=data[0];

rowId=r.Id;

document.getElementById("name").value=r.Name||"";
document.getElementById("date").value=r.Event_date||"";
document.getElementById("story").value=r.Story||"";
document.getElementById("music").value=r.Music||"";

let photos=r.Photos||[];
if(typeof photos==="string")photos=JSON.parse(photos);
document.getElementById("photos").value=photos.join("\n");

let memories=r.Memories||[];
if(typeof memories==="string")memories=JSON.parse(memories);

memories.forEach(x=>addMemory(x));

let videos=r.Videos||[];
if(typeof videos==="string")videos=JSON.parse(videos);

videos.forEach(x=>addVideo(x));

}


function addMemory(value=""){

const d=document.createElement("div");
d.className="item";

d.innerHTML=`
<textarea class="memory">${typeof value==="string"?value:(value.text||"")}</textarea>
<button class="danger" onclick="this.parentElement.remove()">Remove</button>
`;

document.getElementById("memories").appendChild(d);

}


function addVideo(value=""){

const d=document.createElement("div");
d.className="item";

d.innerHTML=`
<input class="video" placeholder="Video URL">
<button class="danger" onclick="this.parentElement.remove()">Remove</button>
`;

d.querySelector(".video").value=value||"";

document.getElementById("videos").appendChild(d);

}


async function save(){

if(!rowId){
document.getElementById("msg").textContent="No row loaded";
return;
}

let photos=document.getElementById("photos").value
.split("\n").map(x=>x.trim()).filter(Boolean);

let memories=[...document.querySelectorAll(".memory")]
.map(x=>x.value.trim()).filter(Boolean);

let videos=[...document.querySelectorAll(".video")]
.map(x=>x.value.trim()).filter(Boolean);

const {error}=await db
.from("rana_mazen")
.update({
Name:document.getElementById("name").value,
Event_date:document.getElementById("date").value,
Story:document.getElementById("story").value,
Music:document.getElementById("music").value,
Photos:photos,
Memories:memories,
Videos:videos
})
.eq("Id",rowId);

document.getElementById("msg").textContent=
error ? error.message : "Saved online successfully ♡";

}

</script>

</body>
</html>
