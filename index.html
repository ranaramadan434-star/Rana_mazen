<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rana & Mazen — Admin</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf7f8;
      color: #333;
    }

    .container {
      width: min(900px, 92%);
      margin: 40px auto;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    h1 { text-align: center; }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 12px;
    }

    .primary {
      background: #222;
      color: white;
      width: 100%;
    }

    .secondary { background: #eee; }
    .danger { background: #f3d4d4; }

    .memory,
    .videoBox {
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 12px;
      margin-top: 12px;
    }

    .hidden { display: none; }

    #loginMessage, #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .logout {
      float: right;
      background: #eee;
    }

    .clear { clear: both; }

    .videoBox input {
      margin-top: 0;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginCard" class="card">
    <h1>Rana & Mazen ♡</h1>

    <label>Email</label>
    <input id="email" type="email">

    <label>Password</label>
    <input id="password" type="password">

    <button class="primary" onclick="login()">Login</button>

    <div id="loginMessage"></div>
  </div>


  <!-- ADMIN -->
  <div id="adminPanel" class="hidden">

    <button class="logout" onclick="logout()">Logout</button>
    <div class="clear"></div>

    <div class="card">

      <h1>Rana & Mazen ♡</h1>

      <label>Names</label>
      <input id="name">

      <label>Date</label>
      <input id="eventDate">

      <label>Story</label>
      <textarea id="story"></textarea>

      <label>Song URL</label>
      <input id="music">


      <!-- PHOTOS -->
      <label>Photo URLs</label>
      <textarea
        id="photos"
        placeholder="Put one photo link per line"
      ></textarea>


      <!-- VIDEOS -->
      <h2>Videos</h2>

      <div id="videos"></div>

      <button class="secondary" onclick="addVideo()">
        + Add video
      </button>


      <!-- MEMORIES -->
      <h2>Memories</h2>

      <div id="memories"></div>

      <button class="secondary" onclick="addMemory()">
        + Add memory
      </button>


      <!-- SAVE -->
      <button class="primary" onclick="saveData()">
        Save Changes ♡
      </button>

      <div id="message"></div>

    </div>
  </div>
</div>


<script>

  /* =========================
     SUPABASE
     ========================= */

  const SUPABASE_URL =
    "https://jqpceabdshvboderrbiz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";


  /* =========================
     LOGIN
     ========================= */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const msg =
      document.getElementById("loginMessage");

    if (!email || !password) {
      msg.textContent = "Enter your email and password.";
      return;
    }

    msg.textContent = "Logging in...";

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );

      const result = await response.json();

      if (!response.ok) {
        msg.textContent =
          result.msg ||
          result.error_description ||
          "Invalid login credentials.";
        return;
      }

      sessionStorage.setItem(
        "rana_admin_logged_in",
        "true"
      );

      showAdmin();
      await loadData();

    } catch (error) {

      msg.textContent =
        "Connection error. Please try again.";
    }
  }


  /* =========================
     LOGOUT
     ========================= */

  function logout() {

    sessionStorage.removeItem(
      "rana_admin_logged_in"
    );

    document
      .getElementById("adminPanel")
      .classList.add("hidden");

    document
      .getElementById("loginCard")
      .classList.remove("hidden");

    document.getElementById("email").value = "";
    document.getElementById("password").value = "";
  }


  /* =========================
     SHOW ADMIN
     ========================= */

  function showAdmin() {

    document
      .getElementById("loginCard")
      .classList.add("hidden");

    document
      .getElementById("adminPanel")
      .classList.remove("hidden");
  }


  /* =========================
     LOAD DATA
     ========================= */

  async function loadData() {

    const msg =
      document.getElementById("message");

    msg.textContent = "Loading...";

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/rana_mazen?select=*",
        {
          method: "GET",

          headers: {
            "apikey": SUPABASE_KEY,
            "Accept": "application/json"
          }
        }
      );

      const data = await response.json();

      if (!response.ok) {

        msg.textContent =
          "Error loading data: " +
          (data.message || data.error || "Unknown error");

        return;
      }

      if (!data || data.length === 0) {

        msg.textContent = "No data found.";
        return;
      }

      const item = data[0];


      /* BASIC DATA */

      document.getElementById("name").value =
        item.Name || "";

      document.getElementById("eventDate").value =
        item.Event_date || "";

      document.getElementById("story").value =
        item.Story || "";

      document.getElementById("music").value =
        item.Music || "";


      /* PHOTOS */

      let photos = item.Photos || [];

      if (!Array.isArray(photos)) {
        photos = [];
      }

      document.getElementById("photos").value =
        photos.join("\n");


      /* VIDEOS */

      const videoContainer =
        document.getElementById("videos");

      videoContainer.innerHTML = "";

      let videos = item.Videos || [];

      if (!Array.isArray(videos)) {
        videos = [];
      }

      videos.forEach(function(video) {
        addVideo(video);
      });


      /* MEMORIES */

      const memoryContainer =
        document.getElementById("memories");

      memoryContainer.innerHTML = "";

      let memories = item.Memories || [];

      if (!Array.isArray(memories)) {
        memories = [];
      }

      memories.forEach(function(memory) {
        addMemory(memory);
      });


      msg.textContent = "";

    } catch (error) {

      msg.textContent =
        "Connection error while loading data.";
    }
  }


  /* =========================
     ADD VIDEO
     ========================= */

  function addVideo(video = "") {

    const container =
      document.getElementById("videos");

    const div =
      document.createElement("div");

    div.className = "videoBox";

    div.innerHTML = `
      <input
        type="text"
        class="videoUrl"
        placeholder="Paste video link here..."
      >

      <button
        class="danger"
        onclick="this.parentElement.remove()">
        Remove
      </button>
    `;

    container.appendChild(div);

    div.querySelector(".videoUrl").value =
      typeof video === "string"
        ? video
        : "";
  }


  /* =========================
     ADD MEMORY
     ========================= */

  function addMemory(memory = "") {

    const container =
      document.getElementById("memories");

    const div =
      document.createElement("div");

    div.className = "memory";

    div.innerHTML = `
      <textarea
        class="memoryText"
        placeholder="Write your memory here..."
      ></textarea>

      <button
        class="danger"
        onclick="this.parentElement.remove()">
        Remove
      </button>
    `;

    container.appendChild(div);

    div.querySelector(".memoryText").value =
      typeof memory === "string"
        ? memory
        : (
            memory && memory.text
              ? memory.text
              : ""
          );
  }


  /* =========================
     SAVE DATA
     ========================= */

  async function saveData() {

    const msg =
      document.getElementById("message");

    msg.textContent = "Saving...";


    const name =
      document.getElementById("name").value.trim();

    const eventDate =
      document.getElementById("eventDate").value.trim();

    const story =
      document.getElementById("story").value;

    const music =
      document.getElementById("music").value.trim();


    /* PHOTOS */

    const photos =
      document
        .getElementById("photos")
        .value
        .split("\n")
        .map(function(x) {
          return x.trim();
        })
        .filter(Boolean);


    /* VIDEOS */

    const videos =
      Array.from(
        document.querySelectorAll(".videoUrl")
      )
      .map(function(x) {
        return x.value.trim();
      })
      .filter(Boolean);


    /* MEMORIES */

    const memories =
      Array.from(
        document.querySelectorAll(".memoryText")
      )
      .map(function(x) {
        return x.value.trim();
      })
      .filter(Boolean);


    try {

      /* Find existing row */

      const findResponse = await fetch(
        SUPABASE_URL +
        "/rest/v1/rana_mazen?select=Id&limit=1",
        {
          headers: {
            "apikey": SUPABASE_KEY,
            "Accept": "application/json"
          }
        }
      );

      const existing =
        await findResponse.json();


      if (
        !findResponse.ok ||
        !existing ||
        existing.length === 0
      ) {

        msg.textContent =
          "Could not find the existing data.";

        return;
      }


      const id =
        existing[0].Id;


      /* UPDATE */

      const updateResponse =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/rana_mazen?Id=eq." +
          encodeURIComponent(id),
          {
            method: "PATCH",

            headers: {
              "apikey": SUPABASE_KEY,
              "Content-Type": "application/json",
              "Prefer": "return=minimal"
            },

            body: JSON.stringify({

              Name: name,

              Event_date: eventDate,

              Story: story,

              Music: music,

              Photos: photos,

              Videos: videos,

              Memories: memories

            })
          }
        );


      if (!updateResponse.ok) {

        const error =
          await updateResponse.json();

        msg.textContent =
          "Save failed: " +
          (error.message || "Unknown error");

        return;
      }


      msg.textContent =
        "Saved online successfully ♡";


    } catch (error) {

      msg.textContent =
        "Connection error while saving.";
    }
  }


  /* =========================
     AUTO LOGIN
     ========================= */

  if (
    sessionStorage.getItem(
      "rana_admin_logged_in"
    ) === "true"
  ) {

    showAdmin();
    loadData();
  }

</script>

</body>
</html>
