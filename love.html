<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rana & Mazen ♡</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f8f2ef;
color:#3b2c2a;
font-family:Georgia,serif;
text-align:center;
}

main{
max-width:700px;
margin:auto;
padding:45px 22px;
}

h1{
font-size:42px;
font-weight:400;
margin:20px 0 8px;
}

.date{
color:#8d6f67;
font-size:18px;
margin-bottom:35px;
}

.story{
background:white;
padding:28px;
border-radius:24px;
box-shadow:0 10px 35px #00000012;
line-height:1.8;
font-size:18px;
}

.photos{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:25px;
}

.photos img{
width:100%;
height:220px;
object-fit:cover;
border-radius:18px;
}

.memory{
background:white;
padding:22px;
margin-top:18px;
border-radius:20px;
box-shadow:0 8px 25px #00000010;
}

.memory h3{
margin:0 0 7px;
font-size:22px;
}

.memory .mdate{
color:#9a7a72;
font-size:14px;
margin-bottom:10px;
}

#music{
margin-top:30px;
}

.loading{
margin-top:60px;
color:#8d6f67;
}
</style>
</head>

<body>

<main>

<div id="loading" class="loading">
Loading our story ♡
</div>

<div id="content" style="display:none">

<h1 id="names">Rana & Mazen ♡</h1>

<div class="date" id="date"></div>

<div class="story" id="story"></div>

<div id="photos" class="photos"></div>

<div id="memories"></div>

<audio id="music" controls></audio>

</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL=
"https://jqpceabdshvboderrbiz.supabase.co";

const SUPABASE_KEY=
"sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";

const supabaseClient=
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function loadLovePage(){

const {data,error}=await supabaseClient
.from("rana_mazen")
.select("*")
.limit(1)
.single();

if(error){
document.getElementById("loading").textContent=
"Something went wrong ♡";
console.log(error);
return;
}

document.getElementById("names").textContent=
(data.Name||"Rana & Mazen")+" ♡";

document.getElementById("date").textContent=
data.Event_date||"";

document.getElementById("story").textContent=
data.Story||"";

const photos=
document.getElementById("photos");

photos.innerHTML="";

if(Array.isArray(data.Photos)){
data.Photos.forEach(url=>{
if(!url)return;

const img=document.createElement("img");
img.src=url;
img.alt="Our memory";
photos.appendChild(img);
});
}

const memories=
document.getElementById("memories");

memories.innerHTML="";

if(Array.isArray(data.Memories)){
data.Memories.forEach(memory=>{

const box=document.createElement("div");
box.className="memory";

box.innerHTML=`
<h3>${escapeHtml(memory.title||"Our memory")}</h3>
<div class="mdate">${escapeHtml(memory.date||"")}</div>
<div>${escapeHtml(memory.text||"")}</div>
`;

memories.appendChild(box);

});
}

const music=
document.getElementById("music");

if(data.Music){
music.src=data.Music;
}else{
music.style.display="none";
}

document.getElementById("loading").style.display="none";
document.getElementById("content").style.display="block";
}

function escapeHtml(text){
const div=document.createElement("div");
div.textContent=text;
return div.innerHTML;
}

loadLovePage();

</script>

</body>
</html>
