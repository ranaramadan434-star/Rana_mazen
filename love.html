<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rana & Mazen ♡</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#fff8f7 0%,#f8eeec 45%,#f4e6e3 100%);
  color:#59413c;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.wrap{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:22px 16px 60px;
}

.hero{
  min-height:75vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:45px 15px;
}

.heart{
  font-size:55px;
  margin-bottom:15px;
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.small{
  font-size:14px;
  letter-spacing:2px;
  color:#9b7d76;
  margin-bottom:15px;
}

h1{
  font-family:Georgia,serif;
  font-size:clamp(42px,10vw,78px);
  margin:0;
  color:#4d3631;
  font-weight:500;
}

.date{
  margin-top:16px;
  font-size:16px;
  color:#987b74;
}

.section{
  margin-top:55px;
}

.title{
  text-align:center;
  font-family:Georgia,serif;
  font-size:32px;
  font-weight:500;
  margin:0 0 25px;
  color:#4d3631;
}

.card{
  background:#ffffffcc;
  backdrop-filter:blur(8px);
  border-radius:28px;
  padding:28px;
  box-shadow:0 12px 40px #0000000b;
  line-height:2;
  font-size:17px;
}

.story{
  white-space:pre-line;
}

.photos-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.photo-card{
  background:white;
  padding:12px 12px 18px;
  border-radius:7px;
  box-shadow:0 10px 28px #00000012;
}

.photo-card:nth-child(odd){
  transform:rotate(-2deg);
}

.photo-card:nth-child(even){
  transform:rotate(2deg);
}

.photo-card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  border-radius:3px;
}

.videos{
  display:flex;
  flex-direction:column;
  gap:25px;
}

.video-box{
  background:white;
  border-radius:28px;
  padding:14px;
  box-shadow:0 12px 35px #00000010;
}

.video-frame{
  width:100%;
  display:block;
  border:0;
  border-radius:20px;
  background:#000;
  max-height:75vh;
}

.video-caption{
  text-align:center;
  font-size:16px;
  color:#705952;
  padding:15px 8px 5px;
}

.memory{
  background:white;
  border-radius:24px;
  padding:23px;
  margin-bottom:17px;
  box-shadow:0 10px 30px #00000009;
}

.memory h3{
  margin:0 0 5px;
  font-family:Georgia,serif;
  font-size:22px;
}

.memory-date{
  color:#a18882;
  font-size:13px;
  margin-bottom:10px;
}

.memory-text{
  line-height:1.9;
  white-space:pre-line;
}

.music-card{
  text-align:center;
  background:white;
  border-radius:28px;
  padding:30px 20px;
  box-shadow:0 10px 35px #0000000c;
}

.music-card p{
  margin-top:0;
  line-height:1.8;
}

.music-btn{
  display:inline-block;
  text-decoration:none;
  background:#59413c;
  color:white;
  padding:14px 24px;
  border-radius:999px;
  font-size:15px;
}

.end{
  text-align:center;
  margin-top:70px;
  font-family:Georgia,serif;
  font-size:23px;
  line-height:1.8;
  color:#624741;
}

.footer-heart{
  font-size:25px;
  margin-top:15px;
}

.hidden{
  display:none;
}

.loading{
  text-align:center;
  padding:50px 15px;
  color:#8f7771;
}

.error{
  text-align:center;
  padding:35px 15px;
  color:#9a5148;
}

@media(max-width:600px){

  .wrap{
    padding-left:12px;
    padding-right:12px;
  }

  .hero{
    min-height:65vh;
  }

  .card{
    padding:22px 18px;
    font-size:16px;
  }

  .photos-grid{
    grid-template-columns:1fr 1fr;
    gap:13px;
  }

  .video-box{
    padding:9px;
    border-radius:22px;
  }

  .video-frame{
    border-radius:16px;
  }

  .title{
    font-size:29px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <section class="hero">

    <div class="heart">♡</div>

    <div class="small">OUR LITTLE STORY</div>

    <h1 id="names">Rana & Mazen</h1>

    <div class="date" id="date"></div>

  </section>


  <!-- STORY -->
  <section id="storySection" class="section">

    <h2 class="title">Our Story</h2>

    <div class="card story" id="story"></div>

  </section>


  <!-- PHOTOS -->
  <section id="photosSection" class="section hidden">

    <h2 class="title">Our Memories</h2>

    <div class="photos-grid" id="photos"></div>

  </section>


  <!-- VIDEOS -->
  <section id="videoSection" class="section hidden">

    <h2 class="title">A Little Video</h2>

    <div class="videos" id="videos"></div>

  </section>


  <!-- MEMORIES -->
  <section id="memoriesSection" class="section hidden">

    <h2 class="title">Little Memories</h2>

    <div id="memories"></div>

  </section>


  <!-- MUSIC -->
  <section id="musicSection" class="section hidden">

    <h2 class="title">Our Song</h2>

    <div class="music-card">

      <p>
        A song that reminds me of us ♡
      </p>

      <a
        id="musicButton"
        class="music-btn"
        href="#"
        target="_blank"
        rel="noopener">
        Listen to our song ♡
      </a>

    </div>

  </section>


  <div class="end">
    And this is only the beginning...
    <div class="footer-heart">♡</div>
  </div>

</div>


<div id="loading" class="loading">
  Loading our little story ♡
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jqpceabdshvboderrbiz.supabase.co";

const SUPABASE_KEY =
"sb_publishable_lgtWi40tBxTt1zPogOQ4oA_Zf8SKU2P";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


async function loadPage(){

  const loading =
    document.getElementById("loading");

  try{

    const result =
      await supabaseClient
        .from("rana_mazen")
        .select("*")
        .limit(1);


    if(result.error){
      throw result.error;
    }


    if(
      !result.data ||
      result.data.length === 0
    ){

      loading.textContent =
        "No saved data yet ♡";

      return;
    }


    const row =
      result.data[0];


    /* NAME */

    document.getElementById("names")
      .textContent =
      row.Name || "Rana & Mazen";


    /* DATE */

    document.getElementById("date")
      .textContent =
      row.Event_date || "";


    /* STORY */

    const story =
      document.getElementById("story");

    if(row.Story && row.Story.trim()){

      story.textContent =
        row.Story;

    }else{

      document.getElementById("storySection")
        .classList.add("hidden");

    }


    /* PHOTOS */

    let photos =
      row.Photos;

    if(typeof photos === "string"){

      try{
        photos = JSON.parse(photos);
      }catch(e){
        photos = [];
      }

    }


    if(
      Array.isArray(photos) &&
      photos.length
    ){

      const photosBox =
        document.getElementById("photos");

      photosBox.innerHTML = "";


      photos.forEach(function(url){

        if(!url) return;


        const card =
          document.createElement("div");

        card.className =
          "photo-card";


        const img =
          document.createElement("img");

        img.src = url;

        img.alt =
          "A memory of Rana & Mazen";

        img.loading = "lazy";


        card.appendChild(img);

        photosBox.appendChild(card);

      });


      document.getElementById("photosSection")
        .classList.remove("hidden");

    }


    /* VIDEOS */

    let videos =
      row.Videos;

    if(typeof videos === "string"){

      try{
        videos = JSON.parse(videos);
      }catch(e){
        videos = [];
      }

    }


    if(
      Array.isArray(videos) &&
      videos.length
    ){

      const videosBox =
        document.getElementById("videos");

      videosBox.innerHTML = "";


      videos.forEach(function(url,index){

        if(!url) return;


        const box =
          document.createElement("div");

        box.className =
          "video-box";


        const video =
          document.createElement("video");

        video.className =
          "video-frame";

        video.controls = true;

        video.playsInline = true;

        video.preload = "metadata";


        const source =
          document.createElement("source");

        source.src = url;

        source.type = "video/mp4";


        video.appendChild(source);


        const caption =
          document.createElement("div");

        caption.className =
          "video-caption";

        caption.textContent =
          videos.length === 1
          ? "A little piece of us ♡"
          : "A little piece of us ♡ " + (index + 1);


        box.appendChild(video);

        box.appendChild(caption);

        videosBox.appendChild(box);

      });


      document.getElementById("videoSection")
        .classList.remove("hidden");

    }


    /* MEMORIES */

    let memories =
      row.Memories;

    if(typeof memories === "string"){

      try{
        memories = JSON.parse(memories);
      }catch(e){
        memories = [];
      }

    }


    if(
      Array.isArray(memories) &&
      memories.length
    ){

      const memoriesBox =
        document.getElementById("memories");

      memoriesBox.innerHTML = "";


      memories.forEach(function(memory){

        const box =
          document.createElement("div");

        box.className =
          "memory";


        if(memory.title){

          const title =
            document.createElement("h3");

          title.textContent =
            memory.title;

          box.appendChild(title);

        }


        if(memory.date){

          const date =
            document.createElement("div");

          date.className =
            "memory-date";

          date.textContent =
            memory.date;

          box.appendChild(date);

        }


        if(memory.text){

          const text =
            document.createElement("div");

          text.className =
            "memory-text";

          text.textContent =
            memory.text;

          box.appendChild(text);

        }


        memoriesBox.appendChild(box);

      });


      document.getElementById("memoriesSection")
        .classList.remove("hidden");

    }


    /* MUSIC */

    if(
      row.Music &&
      row.Music.trim()
    ){

      const button =
        document.getElementById("musicButton");

      button.href =
        row.Music;

      document.getElementById("musicSection")
        .classList.remove("hidden");

    }


    loading.style.display =
      "none";


  }catch(error){

    console.error(error);

    loading.className =
      "error";

    loading.textContent =
      "Something went wrong. Please try again later ♡";

  }

}


loadPage();

</script>

</body>
</html>
